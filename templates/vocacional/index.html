{% extends "vocacional/base_vocacional.html" %}

{% block vocacional_content %}

<div class="actions">
  <a class="btn" href="{% url 'vocacional:etapas' %}">Abrir etapas do teste</a>

  {% if last_done %}
    <a class="btn btn-secondary" href="{% url 'vocacional:resultado' last_done.pk %}">Ver último resultado</a>
  {% endif %}

  {% if request.user.perfil in 'MENTOR,PROF,ADMIN' %}
    <a class="btn" href="{% url 'vocacional:mentor_dashboard' %}">Painel do Mentor</a>
  {% endif %}
</div>

{% endblock %}
